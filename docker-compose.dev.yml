version: "3.9"

services:

  db:
    image: postgres:16
    container_name: employee-db

    restart: always

    environment:
      POSTGRES_DB: employee_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:

    build:
      context: ./backend

    container_name: employee-backend

    restart: always

    env_file:
      - .env.dev

    ports:
      - "5000:5000"

    depends_on:
      - db

  frontend:

    build:
      context: ./frontend

    container_name: employee-frontend

    restart: always

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:

